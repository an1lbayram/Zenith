<!DOCTYPE html>
<html lang="tr" class="theme-emerald">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zenith | Yaşam ve Görev Yönetim Sistemi</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Zenith - Görev yönetimi, alışkanlık takibi, Pomodoro odaklanma seansları ve oyunlaştırma özellikleri sunan modern web uygulaması.">
    <meta name="theme-color" content="#10b981">

    <!-- Content Security Policy (CSP) -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://fonts.googleapis.com https://fonts.gstatic.com https://www.gstatic.com data: blob:;">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--color-primary)',
                        secondary: 'var(--color-secondary)',
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- PWA & Favicon -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/icons/favicon.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

    <!-- Custom Styling -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="text-gray-800 dark:text-gray-100 selection:bg-primary selection:text-white">

    <!-- Confetti Particle Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Offline Connection Indicator -->
    <div id="offline-indicator"
        class="hidden fixed top-0 left-0 w-full bg-rose-600 text-white text-center text-xs py-1.5 z-50 font-extrabold tracking-wider shadow-lg">
        ⚠️ İNTERNET BAĞLANTISI YOK - ÇEVRİMDIŞI MODDA ÇALIŞILIYOR
    </div>

    <!-- Main Container -->
    <div class="flex h-screen overflow-hidden">

        <!-- Sidebar Navigation (Desktop & Tablet) -->
        <nav class="hidden md:flex flex-col w-20 lg:w-64 glass-panel border-r z-20 transition-all duration-300">
            <!-- App Logo / Title -->
            <div class="p-6 flex items-center justify-center lg:justify-start gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-primary to-emerald-400 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-primary/30 cursor-pointer" onclick="app.router.navigate('dashboard')">
                    Z
                </div>
                <div class="hidden lg:block">
                    <span class="font-extrabold text-xl tracking-tight text-gray-900 dark:text-white cursor-pointer" onclick="app.router.navigate('dashboard')">Zenith</span>
                    <a href="https://an1lbayram-github-io.vercel.app/" target="_blank" rel="noopener noreferrer" class="block text-[11px] text-primary font-bold hover:underline transition-colors mt-0.5">&lt;/&gt; Created by an1lbayram</a>
                </div>
            </div>

            <!-- Nav Links -->
            <div class="flex-1 py-4 flex flex-col gap-2 px-3">
                <button onclick="app.router.navigate('dashboard')" data-nav-route="dashboard"
                    class="nav-btn flex items-center gap-3.5 p-3.5 rounded-2xl hover:bg-primary/10 transition-all text-gray-600 dark:text-gray-300 font-semibold text-sm">
                    <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
                        </path>
                    </svg>
                    <span class="hidden lg:block">Panel</span>
                </button>

                <button onclick="app.router.navigate('tasks')" data-nav-route="tasks"
                    class="nav-btn flex items-center gap-3.5 p-3.5 rounded-2xl hover:bg-primary/10 transition-all text-gray-600 dark:text-gray-300 font-semibold text-sm">
                    <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4">
                        </path>
                    </svg>
                    <span class="hidden lg:block">Görevler</span>
                </button>

                <button onclick="app.router.navigate('habits')" data-nav-route="habits"
                    class="nav-btn flex items-center gap-3.5 p-3.5 rounded-2xl hover:bg-primary/10 transition-all text-gray-600 dark:text-gray-300 font-semibold text-sm">
                    <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    <span class="hidden lg:block">Alışkanlıklar</span>
                </button>

                <button onclick="app.router.navigate('focus')" data-nav-route="focus"
                    class="nav-btn flex items-center gap-3.5 p-3.5 rounded-2xl hover:bg-primary/10 transition-all text-gray-600 dark:text-gray-300 font-semibold text-sm">
                    <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span class="hidden lg:block">Odak Modu</span>
                </button>
            </div>

            <!-- User Profile & Level Widget -->
            <div class="p-4 border-t border-gray-200/50 dark:border-gray-700/50">
                <div class="flex items-center gap-3 cursor-pointer p-2 rounded-2xl hover:bg-gray-100 dark:hover:bg-gray-800/80 transition-colors" onclick="app.ui.openProfileModal()">
                    <div class="relative flex-shrink-0">
                        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-primary to-blue-500 flex items-center justify-center text-white font-bold text-lg shadow-md"
                            id="user-avatar">⚡</div>
                        <div class="absolute -bottom-1 -right-1 bg-amber-400 text-slate-950 text-[10px] font-black px-1.5 rounded-full border border-white dark:border-gray-900 shadow-sm"
                            id="user-level-badge">Lvl 1</div>
                    </div>
                    <div class="hidden lg:block flex-1 min-w-0">
                        <div class="text-sm font-bold text-gray-900 dark:text-white truncate" id="user-name">Kullanıcı</div>
                        <div class="text-xs text-primary font-semibold" id="user-xp">0 XP</div>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col relative overflow-hidden">
            <!-- Header Bar -->
            <header class="h-16 glass-panel border-b flex items-center justify-between px-6 z-10">
                <h1 class="text-xl font-extrabold text-gray-900 dark:text-white tracking-tight" id="page-title">Genel Bakış</h1>

                <div class="flex items-center gap-3">
                    <!-- Color Themes -->
                    <div class="flex items-center gap-1.5 bg-gray-100 dark:bg-gray-800/80 rounded-full p-1.5 border border-gray-200 dark:border-gray-700">
                        <button onclick="app.ui.setTheme('emerald')" title="Emerald"
                            class="w-4 h-4 rounded-full bg-emerald-500 hover:scale-125 transition-transform"></button>
                        <button onclick="app.ui.setTheme('blue')" title="Blue"
                            class="w-4 h-4 rounded-full bg-blue-500 hover:scale-125 transition-transform"></button>
                        <button onclick="app.ui.setTheme('purple')" title="Purple"
                            class="w-4 h-4 rounded-full bg-purple-500 hover:scale-125 transition-transform"></button>
                        <button onclick="app.ui.setTheme('red')" title="Red"
                            class="w-4 h-4 rounded-full bg-rose-500 hover:scale-125 transition-transform"></button>
                        <button onclick="app.ui.setTheme('amber')" title="Amber"
                            class="w-4 h-4 rounded-full bg-amber-500 hover:scale-125 transition-transform"></button>
                    </div>

                    <!-- Dark Mode Toggle -->
                    <button onclick="app.ui.toggleDarkMode()" title="Tema Değiştir"
                        class="p-2 rounded-2xl hover:bg-gray-200/60 dark:hover:bg-gray-700/60 transition-colors text-gray-600 dark:text-gray-300">
                        <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
                            </path>
                        </svg>
                        <svg class="w-5 h-5 hidden dark:block text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                            </path>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Dynamic Route Content -->
            <div id="content-area" class="flex-1 overflow-y-auto p-4 md:p-8 pb-24 md:pb-8 relative">
                <!-- Injected via Router -->
            </div>

            <!-- Mobile Bottom Navigation -->
            <div class="md:hidden fixed bottom-0 left-0 w-full glass-panel border-t flex justify-around items-center p-2.5 z-30 shadow-2xl">
                <button onclick="app.router.navigate('dashboard')" data-nav-route="dashboard"
                    class="flex flex-col items-center text-xs gap-1 text-primary font-bold">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
                        </path>
                    </svg>
                    <span>Panel</span>
                </button>

                <button onclick="app.router.navigate('tasks')" data-nav-route="tasks"
                    class="flex flex-col items-center text-xs gap-1 text-gray-500 dark:text-gray-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4">
                        </path>
                    </svg>
                    <span>Görevler</span>
                </button>

                <!-- Quick Add Center Action Button -->
                <button onclick="app.ui.openQuickAdd()" class="flex flex-col items-center justify-center -mt-8 focus:outline-none">
                    <div class="w-14 h-14 rounded-full bg-primary shadow-xl shadow-primary/40 flex items-center justify-center text-white text-2xl font-black transform active:scale-90 transition-transform">
                        +
                    </div>
                </button>

                <button onclick="app.router.navigate('habits')" data-nav-route="habits"
                    class="flex flex-col items-center text-xs gap-1 text-gray-500 dark:text-gray-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    <span>Alışkanlık</span>
                </button>

                <button onclick="app.router.navigate('focus')" data-nav-route="focus"
                    class="flex flex-col items-center text-xs gap-1 text-gray-500 dark:text-gray-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span>Odak</span>
                </button>
            </div>
        </main>
    </div>

    <!-- Desktop Global Floating Action Button (FAB) -->
    <button onclick="app.ui.openQuickAdd()" title="Yeni Görev Ekle"
        class="hidden md:flex fixed bottom-8 right-8 w-14 h-14 bg-primary rounded-full shadow-2xl shadow-primary/50 items-center justify-center text-white text-2xl font-bold hover:scale-110 active:scale-95 transition-transform z-40">
        +
    </button>

    <!-- Toast Notification Container -->
    <div id="toast-container"
        class="fixed bottom-20 md:bottom-8 right-4 md:right-8 flex flex-col gap-2 z-50 pointer-events-none">
    </div>

    <!-- Modal Backdrop & Box -->
    <div id="modal-backdrop"
        class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 hidden flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div id="modal-content"
            class="bg-white dark:bg-gray-800 rounded-3xl shadow-2xl w-full max-w-lg mx-4 transform scale-95 transition-transform duration-300 max-h-[90vh] overflow-y-auto border border-gray-100 dark:border-gray-700">
            <!-- Injected via UI.showModal -->
        </div>
    </div>

    <!-- App Entry Point -->
    <script type="module" src="assets/js/app.js"></script>
</body>

</html>
