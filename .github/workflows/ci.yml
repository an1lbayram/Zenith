name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Code Quality Testing + Dependency Security
  lint-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint (Code Quality Testing)
        run: npm run lint
      - name: npm audit (Dependency Security)
        run: npm run audit

  # Unit / Component / Integration / Functional QA / Security / SEO / API-contract Testing
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Vitest suite
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # E2E / Cross-Browser / Responsive / Visual Regression / Accessibility Testing
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Playwright suite (E2E, cross-browser, responsive, visual, a11y)
        run: npx playwright test --grep-invert "Lighthouse"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Performance / SEO Testing (Lighthouse) - separate job: slower, and a
  # transient perf-score dip on a shared CI runner shouldn't block the rest
  # of the suite from reporting.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Lighthouse audit
        run: npx playwright test --project=chromium-desktop e2e/performance-seo.spec.js
